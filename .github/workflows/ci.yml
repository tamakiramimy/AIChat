name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Vue3/package-lock.json
      - run: npm ci
        working-directory: Vue3
      - run: npm run build
        working-directory: Vue3

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DotnetApi/AIChat.csproj
      - run: dotnet build DotnetApi/AIChat.csproj --configuration Release --no-restore
      - run: dotnet publish DotnetApi/AIChat.csproj --configuration Release --no-build --output artifacts/api